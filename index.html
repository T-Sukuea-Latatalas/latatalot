<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人工言語 辞書</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* ヘッダー */
    header {
      border-bottom: 2px solid #ffffff;
      padding-bottom: 24px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title h1 {
      font-size: 1.8rem;
      letter-spacing: 0.1em;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* コントロール（検索・ソート切替） */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background-color: #000000;
      border: 1px solid #ffffff;
      color: #ffffff;
      padding: 12px 14px 12px 44px;
      font-size: 1rem;
      outline: none;
      transition: background-color 0.2s, color 0.2s;
    }

    .search-input:focus {
      background-color: #111111;
      border-width: 2px;
      padding: 11px 13px 11px 43px;
    }

    .search-input::placeholder {
      color: #777777;
    }

    .switch-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .word-count {
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }

    /* ソート切替スイッチ */
    .sort-switch {
      display: inline-flex;
      border: 1px solid #ffffff;
      padding: 2px;
      background-color: #000000;
    }

    .sort-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      padding: 8px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.05em;
      transition: background-color 0.2s, color 0.2s;
    }

    .sort-btn.active {
      background-color: #ffffff;
      color: #000000;
      font-weight: 700;
    }

    .sort-btn:not(.active):hover {
      background-color: #222222;
    }

    /* 単語リスト */
    .word-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 単語カード（1行1単語） */
    .word-card {
      border: 1px solid #ffffff;
      background-color: #000000;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .word-card:hover {
      background-color: #0d0d0d;
    }

    /* 単語カードのヘッダー部 */
    .card-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .card-title-area {
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
      flex: 1;
    }

    .word-text {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .preview-meanings {
      font-size: 0.9rem;
      color: #cccccc;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .preview-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .preview-pos {
      border: 1px solid #ffffff;
      font-size: 0.7rem;
      padding: 1px 6px;
      letter-spacing: 0.05em;
    }

    .arrow-icon {
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }

    .word-card.open .arrow-icon {
      transform: rotate(180deg);
    }

    /* 詳細展開アコーディオン */
    .card-details {
      display: none;
      border-top: 1px dashed #ffffff;
      padding: 20px;
      background-color: #050505;
      cursor: default;
    }

    .word-card.open .card-details {
      display: block;
    }

    .meaning-block {
      padding: 12px 0;
      border-bottom: 1px solid #222222;
    }

    .meaning-block:first-child {
      padding-top: 0;
    }

    .meaning-block:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .meaning-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .sense-index {
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid #ffffff;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .pos-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      background-color: #ffffff;
      color: #000000;
      font-weight: 700;
    }

    .meaning-text {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .detail-text {
      margin-top: 6px;
      padding-left: 32px;
      font-size: 0.9rem;
      color: #bbbbbb;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    /* 状態表示（ロード中・空など） */
    .status-message {
      text-align: center;
      padding: 60px 20px;
      border: 1px dashed #ffffff;
      margin-top: 20px;
      font-size: 1rem;
      letter-spacing: 0.05em;
    }

    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 2px solid #ffffff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title">
        <!-- ロゴ (本と文字のSVG) -->
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="square">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <h1>Dictionary</h1>
      </div>

      <div class="switch-container">
        <!-- スプレッドシート順 / ABC順 切替スイッチ -->
        <div class="sort-switch" role="group" aria-label="並び順">
          <button id="btn-default" class="sort-btn active" type="button">
            <!-- リスト順SVG -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            登録順
          </button>
          <button id="btn-abc" class="sort-btn" type="button">
            <!-- A-Z順SVG -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 8l4-4 4 4"></path>
              <path d="M7 4v16"></path>
              <path d="M15 8h5"></path>
              <path d="M15 12h3"></path>
              <path d="M15 16h5"></path>
            </svg>
            ABC順
          </button>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="search-box">
        <!-- 検索SVG -->
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="単語・意味・品詞で検索...">
      </div>

      <div class="word-count" id="count-display">0 語 表示中</div>
    </div>

    <!-- 単語リスト出力エリア -->
    <main class="word-list" id="word-list">
      <div class="status-message">
        <div class="spinner"></div>
        <div>データを読み込んでいます...</div>
      </div>
    </main>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT8zvVHi5-is7GFyYU_-0wxzsxo37Ix2g_pNmBomqqZ8EQT8iVZxpW0JhFjs2o7yrG4ogVf7svjnnTw/pub?gid=0&single=true&output=csv';

    let dictionary = [];
    let currentSort = 'default'; // 'default' または 'abc'

    // CSVパース関数（改行・クォート・カンマ対応）
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = '';
      let insideQuote = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (insideQuote) {
          if (char === '"' && nextChar === '"') {
            cell += '"';
            i++;
          } else if (char === '"') {
            insideQuote = false;
          } else {
            cell += char;
          }
        } else {
          if (char === '"') {
            insideQuote = true;
          } else if (char === ',') {
            row.push(cell.trim());
            cell = '';
          } else if (char === '\n') {
            row.push(cell.trim());
            if (row.some(c => c !== '')) rows.push(row);
            row = [];
            cell = '';
          } else if (char !== '\r') {
            cell += char;
          }
        }
      }
      if (cell !== '' || row.length > 0) {
        row.push(cell.trim());
        if (row.some(c => c !== '')) rows.push(row);
      }
      return rows;
    }

    // データ読み込み＆同一スペルの統合
    async function loadData() {
      try {
        const res = await fetch(CSV_URL);
        if (!res.ok) throw new Error('通信エラー');
        const csvText = await res.text();
        const rows = parseCSV(csvText);

        if (rows.length === 0) {
          showEmpty('データが存在しません。');
          return;
        }

        // 1行目がヘッダー（「単語」など）の場合は除外
        let startIndex = 0;
        const firstCol = rows[0][0].toLowerCase();
        if (firstCol.includes('単語') || firstCol === 'word') {
          startIndex = 1;
        }

        // 単語スペルごとに集約（出現順を保つため Map を使用）
        const wordMap = new Map();
        let originalOrder = 0;

        for (let i = startIndex; i < rows.length; i++) {
          const row = rows[i];
          const word = row[0] ? row[0].trim() : '';
          const meaning = row[1] ? row[1].trim() : '';
          const pos = row[2] ? row[2].trim() : '';
          const detail = row[3] ? row[3].trim() : '';

          if (!word) continue;

          // 大文字小文字の差異を同一視しつつ、表示用スペルは最初に登録されたものを保持
          const lookupKey = word.toLowerCase();

          if (!wordMap.has(lookupKey)) {
            wordMap.set(lookupKey, {
              order: originalOrder++,
              word: word,
              senses: []
            });
          }

          wordMap.get(lookupKey).senses.push({
            meaning,
            pos,
            detail
          });
        }

        dictionary = Array.from(wordMap.values());
        render();

      } catch (err) {
        console.error(err);
        showEmpty('スプレッドシートの読み込みに失敗しました。');
      }
    }

    // 表示レンダリング
    function render() {
      const container = document.getElementById('word-list');
      const searchWord = document.getElementById('search-input').value.trim().toLowerCase();

      // 検索フィルタリング
      let list = dictionary.filter(item => {
        if (!searchWord) return true;
        if (item.word.toLowerCase().includes(searchWord)) return true;
        return item.senses.some(s => 
          (s.meaning && s.meaning.toLowerCase().includes(searchWord)) ||
          (s.pos && s.pos.toLowerCase().includes(searchWord)) ||
          (s.detail && s.detail.toLowerCase().includes(searchWord))
        );
      });

      // 並び替え
      if (currentSort === 'abc') {
        list.sort((a, b) => a.word.localeCompare(b.word, 'en', { sensitivity: 'base' }));
      } else {
        list.sort((a, b) => a.order - b.order);
      }

      document.getElementById('count-display').textContent = `${list.length} 語 表示中`;

      if (list.length === 0) {
        showEmpty('該当する単語が見つかりません。');
        return;
      }

      container.innerHTML = '';

      list.forEach(item => {
        const card = document.createElement('article');
        card.className = 'word-card';

        // プレビュー表示用
        const previewHtml = item.senses.map((s, idx) => `
          <span class="preview-item">
            ${s.pos ? `<span class="preview-pos">${escapeHtml(s.pos)}</span>` : ''}
            <span>${escapeHtml(s.meaning)}</span>
          </span>
        `).join('<span style="color:#666;">/</span>');

        // 詳細展開部
        const sensesHtml = item.senses.map((s, idx) => `
          <div class="meaning-block">
            <div class="meaning-header">
              ${item.senses.length > 1 ? `<span class="sense-index">${idx + 1}</span>` : ''}
              ${s.pos ? `<span class="pos-badge">${escapeHtml(s.pos)}</span>` : ''}
              <span class="meaning-text">${escapeHtml(s.meaning || '（意味なし）')}</span>
            </div>
            ${s.detail ? `<div class="detail-text">${escapeHtml(s.detail)}</div>` : ''}
          </div>
        `).join('');

        card.innerHTML = `
          <div class="card-header">
            <div class="card-title-area">
              <span class="word-text">${escapeHtml(item.word)}</span>
              <div class="preview-meanings">${previewHtml}</div>
            </div>
            <!-- 下向き矢印SVG -->
            <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div class="card-details">
            ${sensesHtml}
          </div>
        `;

        // 枠をクリックで詳細を展開
        card.addEventListener('click', () => {
          card.classList.toggle('open');
        });

        container.appendChild(card);
      });
    }

    function showEmpty(msg) {
      document.getElementById('word-list').innerHTML = `
        <div class="status-message">${escapeHtml(msg)}</div>
      `;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // イベントリスナー
    document.getElementById('btn-default').addEventListener('click', () => {
      currentSort = 'default';
      document.getElementById('btn-default').classList.add('active');
      document.getElementById('btn-abc').classList.remove('active');
      render();
    });

    document.getElementById('btn-abc').addEventListener('click', () => {
      currentSort = 'abc';
      document.getElementById('btn-abc').classList.add('active');
      document.getElementById('btn-default').classList.remove('active');
      render();
    });

    document.getElementById('search-input').addEventListener('input', () => {
      render();
    });

    // 初期実行
    loadData();
  </script>
</body>
</html>
