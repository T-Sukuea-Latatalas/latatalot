<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人工言語 辞書 (Conlang Dictionary)</title>
  
  <!-- Google Fonts (UI・日本語用) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- PapaParse (CSVパーサー) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    /* ==========================================
       独自フォントの読み込み設定
       ========================================== */
    @font-face {
      font-family: 'ConlangFont';
      src: url('./Font_lttl3-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-focus: #818cf8;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius: 12px;
      
      /* フォントスタック */
      --font-conlang: 'ConlangFont', 'Inter', sans-serif;
      --font-ui: 'Inter', 'Noto Sans JP', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-ui);
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2rem 1rem 4rem;
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    /* ヘッダー */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* 検索バーエリア */
    .search-section {
      background: var(--card-bg);
      padding: 1.25rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      position: sticky;
      top: 1rem;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      width: 20px;
      height: 20px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      font-size: 1rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
      background-color: #f8fafc;
      font-family: var(--font-ui);
    }

    .search-input:focus {
      background-color: #fff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .search-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 0 0.25rem;
    }

    /* 単語一覧グリッド */
    .word-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.25rem;
    }

    /* 単語カード */
    .word-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
    }

    .word-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .word-header {
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 0.75rem;
      margin-bottom: 0.75rem;
    }

    /* ★独自フォント適用: 単語カードの見出し */
    .word-title {
      font-family: var(--font-conlang);
      font-size: 1.6rem;
      line-height: 1.3;
      letter-spacing: 0.02em;
      color: #0f172a;
      word-break: break-word;
    }

    /* 発音記号（通常フォント） */
    .word-pronunciation {
      font-family: monospace, var(--font-ui);
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* 意味リスト */
    .meanings-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      flex-grow: 1;
    }

    .meaning-item {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      font-size: 0.95rem;
    }

    .meaning-num {
      background: #f1f5f9;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 0.2rem;
    }

    .meaning-body {
      flex: 1;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .meaning-text {
      color: #334155;
    }

    /* 例文ボタン */
    .btn-example {
      background: var(--primary-light);
      color: var(--primary);
      border: none;
      border-radius: 6px;
      padding: 0.2rem 0.55rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: var(--font-ui);
    }

    .btn-example:hover {
      background: #e0e7ff;
      color: var(--primary-hover);
    }

    /* ローディング & エラー / 空表示 */
    .state-message {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #e2e8f0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 1rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 480px;
      padding: 1.5rem;
      position: relative;
      transform: translateY(12px) scale(0.98);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close-btn:hover {
      background: #f1f5f9;
      color: var(--text-main);
    }

    .modal-header {
      margin-bottom: 1rem;
    }

    .modal-badge {
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary);
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      display: inline-block;
      margin-bottom: 0.35rem;
    }

    /* ★独自フォント適用: モーダル内の単語 */
    .modal-word {
      font-family: var(--font-conlang);
      font-size: 1.5rem;
      line-height: 1.3;
      color: #0f172a;
    }

    .modal-meaning-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    .modal-content-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      margin-top: 0.75rem;
    }

    /* ★独自フォント適用: モーダル内の人工言語例文 */
    .example-lang {
      font-family: var(--font-conlang);
      font-size: 1.25rem;
      line-height: 1.4;
      color: #1e293b;
      margin-bottom: 0.45rem;
      word-break: break-word;
    }

    /* 日本語訳（通常フォント） */
    .example-ja {
      font-family: var(--font-ui);
      font-size: 0.9rem;
      color: #475569;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>人工言語 辞書</h1>
      <p>Conlang Dictionary Database</p>
    </header>

    <!-- 検索バー -->
    <div class="search-section">
      <div class="search-box">
        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="単語・発音・日本語で検索..." autocomplete="off">
      </div>
      <div class="search-meta">
        <span id="resultCount">読み込み中...</span>
        <span id="statusIndicator"></span>
      </div>
    </div>

    <!-- 単語カードコンテナ -->
    <main id="wordList" class="word-list">
      <div class="state-message">
        <div class="spinner"></div>
        <p>辞書データを取得しています...</p>
      </div>
    </main>
  </div>

  <!-- 例文モーダル -->
  <div id="exampleModal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <button id="modalCloseBtn" class="modal-close-btn" aria-label="閉じる">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
      <div class="modal-header">
        <span class="modal-badge">例文</span>
        <div id="modalWord" class="modal-word"></div>
        <div id="modalMeaning" class="modal-meaning-label"></div>
      </div>
      <div class="modal-content-box">
        <div id="modalExampleLang" class="example-lang"></div>
        <div id="modalExampleJa" class="example-ja"></div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 設定: GoogleスプレッドシートのCSV公開URL
    // ==========================================
    const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8zvVHi5-is7GFyYU_-0wxzsxo37Ix2g_pNmBomqqZ8EQT8iVZxpW0JhFjs2o7yrG4ogVf7svjnnTw/pubhtml?gid=0&single=true";

    // サンプルデータ
    const DEMO_CSV_DATA = `word,pronunciation,meaning1,example_lang1,example_ja1,meaning2,example_lang2,example_ja2,meaning3,example_lang3,example_ja3
elena,/e'le.na/,太陽,Elena luma sora.,太陽が空を照らす。,光,Elena no vis.,光が見える。,,
solas,/so'las/,平和,Solas viva ton.,私たちは平和に生きる。,,,,,,
luma,/lu'ma/,輝く,Kael luma.,星が輝いている。,照らす,,,,
kael,/ka.el/,星,Kaelen noxi.,夜空に星がある。,,,,,,
viva,/vi'va/,生きる,Ton viva solas.,私たちは平和に生きる。,,,,,,
noxi,/nok'si/,夜,Noxi vana.,夜が訪れる。,闇,,,,
mora,/mo'ra/,水,Mora pura.,水が澄んでいる。,川,,,,
tara,/ta'ra/,大地,Tara grandi.,大地は広い。,,,,,,`;

    let allWords = [];
    let currentWords = [];

    const wordListEl = document.getElementById('wordList');
    const searchInput = document.getElementById('searchInput');
    const resultCountEl = document.getElementById('resultCount');
    const statusIndicator = document.getElementById('statusIndicator');
    const modal = document.getElementById('exampleModal');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalWord = document.getElementById('modalWord');
    const modalMeaning = document.getElementById('modalMeaning');
    const modalExampleLang = document.getElementById('modalExampleLang');
    const modalExampleJa = document.getElementById('modalExampleJa');

    document.addEventListener('DOMContentLoaded', () => {
      fetchDictionaryData();
      setupEventListeners();
    });

    function setupEventListeners() {
      searchInput.addEventListener('input', () => {
        filterWords(searchInput.value);
      });

      modalCloseBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
          closeModal();
        }
      });
    }

    async function fetchDictionaryData() {
      try {
        let csvText = '';
        if (SPREADSHEET_CSV_URL && SPREADSHEET_CSV_URL.trim() !== "") {
          const res = await fetch(SPREADSHEET_CSV_URL);
          if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
          csvText = await res.text();
          statusIndicator.textContent = '● 連携中';
          statusIndicator.style.color = '#10b981';
        } else {
          csvText = DEMO_CSV_DATA;
          statusIndicator.textContent = '● デモデータ表示中';
          statusIndicator.style.color = '#f59e0b';
        }

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: (results) => {
            processWords(results.data);
          },
          error: (err) => {
            showError('CSVのパースに失敗しました: ' + err.message);
          }
        });

      } catch (err) {
        showError('スプレッドシートの取得に失敗しました。URLと公開設定を確認してください。');
        console.error(err);
      }
    }

    // 意味・例文の無制限追加に対応
    function processWords(rawRows) {
      const validWords = [];

      rawRows.forEach((row, index) => {
        const word = (row.word || '').trim();
        const meaning1 = (row.meaning1 || '').trim();

        if (!word || !meaning1) return;

        const pronunciation = (row.pronunciation || '').trim();
        const meanings = [];

        // 行内の "meaning[数字]" カラムをすべて検出
        const meaningKeys = Object.keys(row)
          .filter(k => /^meaning\d+$/.test(k))
          .sort((a, b) => {
            const numA = parseInt(a.replace('meaning', ''), 10);
            const numB = parseInt(b.replace('meaning', ''), 10);
            return numA - numB;
          });

        meaningKeys.forEach(key => {
          const num = key.replace('meaning', '');
          const m = (row[key] || '').trim();
          if (m) {
            const exLang = (row[`example_lang${num}`] || '').trim();
            const exJa = (row[`example_ja${num}`] || '').trim();
            meanings.push({
              meaning: m,
              example_lang: exLang,
              example_ja: exJa,
              hasExample: !!(exLang || exJa)
            });
          }
        });

        validWords.push({
          id: index,
          word,
          pronunciation,
          meanings
        });
      });

      // アルファベット順でソート
      validWords.sort((a, b) => a.word.localeCompare(b.word, 'en', { sensitivity: 'base' }));

      allWords = validWords;
      renderWords(allWords);
    }

    function renderWords(words) {
      currentWords = words;
      resultCountEl.textContent = `${words.length} 件ヒット (全 ${allWords.length} 語)`;

      if (words.length === 0) {
        wordListEl.innerHTML = `
          <div class="state-message">
            <p>一致する単語が見つかりませんでした。</p>
          </div>
        `;
        return;
      }

      wordListEl.innerHTML = words.map((item, wordIdx) => {
        const pronunciationHtml = item.pronunciation 
          ? `<div class="word-pronunciation">${escapeHtml(item.pronunciation)}</div>` 
          : '';

        const meaningsHtml = item.meanings.map((m, mIdx) => {
          const numLabel = item.meanings.length > 1 
            ? `<span class="meaning-num">${mIdx + 1}</span>` 
            : '';

          const exampleBtn = m.hasExample 
            ? `<button class="btn-example" onclick="openModal(${wordIdx}, ${mIdx})">例文</button>` 
            : '';

          return `
            <li class="meaning-item">
              ${numLabel}
              <div class="meaning-body">
                <span class="meaning-text">${escapeHtml(m.meaning)}</span>
                ${exampleBtn}
              </div>
            </li>
          `;
        }).join('');

        return `
          <article class="word-card">
            <div class="word-header">
              <h2 class="word-title">${escapeHtml(item.word)}</h2>
              ${pronunciationHtml}
            </div>
            <ul class="meanings-list">
              ${meaningsHtml}
            </ul>
          </article>
        `;
      }).join('');
    }

    function filterWords(rawQuery) {
      const q = rawQuery.trim().toLowerCase();
      if (!q) {
        renderWords(allWords);
        return;
      }

      const filtered = allWords.filter(item => {
        if (item.word.toLowerCase().includes(q)) return true;
        if (item.pronunciation && item.pronunciation.toLowerCase().includes(q)) return true;
        const matchesMeaning = item.meanings.some(m => m.meaning.toLowerCase().includes(q));
        if (matchesMeaning) return true;

        return false;
      });

      renderWords(filtered);
    }

    window.openModal = function(displayIndex, meaningIndex) {
      const item = currentWords[displayIndex];
      if (!item) return;

      const m = item.meanings[meaningIndex];
      if (!m) return;

      modalWord.textContent = item.word;
      modalMeaning.textContent = `意味: ${m.meaning}`;
      modalExampleLang.textContent = m.example_lang || '（人工言語例文なし）';
      modalExampleJa.textContent = m.example_ja || '（日本語訳なし）';

      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
    };

    function closeModal() {
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
    }

    function showError(msg) {
      wordListEl.innerHTML = `
        <div class="state-message" style="color: #ef4444;">
          <p>${escapeHtml(msg)}</p>
        </div>
      `;
      resultCountEl.textContent = '取得失敗';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
